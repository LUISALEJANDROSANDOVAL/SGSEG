services:
  postgres:
    image: postgres:16-alpine
    container_name: sgseg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgseg
      POSTGRES_USER: sgseg
      POSTGRES_PASSWORD: sgseg
    ports:
      - "5437:5432"
    volumes:
      - sgseg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgseg -d sgseg"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgseg-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://sgseg:sgseg@postgres:5432/sgseg?schema=public"
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: "sgseg_jwt_super_secret_key_2026"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:8080,http://localhost:80,http://localhost"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sgseg-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "8081:80"
    depends_on:
      - backend

volumes:
  sgseg-postgres-data:
